# Publishes the whole repository to GitHub Pages on every push to main.
# A custom workflow is used on purpose: the soft limit of 10 Pages builds per hour
# does not apply to sites published this way, so a busy stream can never trip it.
name: Publish the Ledger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a newer push replaces a deploy that is still running
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
